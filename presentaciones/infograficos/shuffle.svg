<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="shuffle-title shuffle-desc"><title id="shuffle-title">Repartir por clave puede concentrar el trabajo</title><desc id="shuffle-desc">Ejemplo ilustrativo 9 a 1: el shuffle mueve datos y el skew concentra trabajo. No son mediciones del dataset del curso.</desc><defs><marker id="shuffle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><g class="visual-node" style="--node-delay:0ms"><rect x="10" y="35" width="240" height="240" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="28" y="67" fill="#172139" font-size="19" font-weight="700"><tspan x="28" dy="0">Antes del shuffle</tspan></text><text x="28" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="28" dy="0">Cada partición procesa</tspan><tspan x="28" dy="22.1">una parte de la entrada</tspan></text></g><g class="visual-node" style="--node-delay:140ms"><rect x="360" y="35" width="250" height="240" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="378" y="67" fill="#2345cc" font-size="19" font-weight="700"><tspan x="378" dy="0">Exchange</tspan></text><text x="378" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="378" dy="0">Redistribuye por clave:</tspan><tspan x="378" dy="22.1">mueve datos entre workers</tspan></text></g><path d="M255 160L355 160" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#shuffle-arrow)"/><path d="M615 160L675 160" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#shuffle-arrow)"/><text x="690" y="60" fill="#172139" font-size="18" font-weight="700"><tspan x="690" dy="0">Después: clave desbalanceada</tspan></text><rect class="visual-node" x="690" y="105" width="252" height="36" rx="5" fill="#2345cc"/><text x="690" y="169" fill="#172139" font-size="18" font-weight="400"><tspan x="690" dy="0">Worker A · 9 unidades</tspan></text><rect class="visual-node" x="690" y="195" width="28" height="36" rx="5" fill="#aeb8cd"/><text x="690" y="259" fill="#172139" font-size="18" font-weight="400"><tspan x="690" dy="0">Worker B · 1 unidad</tspan></text><text x="10" y="330" fill="#647086" font-size="17" font-weight="400"><tspan x="10" dy="0">Ejemplo esquemático: el worker lento determina la espera. Medir tasks y bytes, no solo tiempo total.</tspan></text></g></svg>