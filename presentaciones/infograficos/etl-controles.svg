<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="etl-controles-title etl-controles-desc"><title id="etl-controles-title">Un ETL se acepta con evidencia en cada etapa</title><desc id="etl-controles-desc">Validar extracción, transformación y carga; la decisión final necesita consumidor y responsable.</desc><defs><marker id="etl-controles-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><g class="visual-node" style="--node-delay:0ms"><rect x="10" y="50" width="225" height="225" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="28" y="82" fill="#172139" font-size="19" font-weight="700"><tspan x="28" dy="0">Extraer</tspan></text><text x="28" y="134" fill="#647086" font-size="17" font-weight="400"><tspan x="28" dy="0">Origen, fecha, filas y</tspan><tspan x="28" dy="22.1">permisos</tspan></text></g><path d="M237 160L254 160" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#etl-controles-arrow)"/><g class="visual-node" style="--node-delay:140ms"><rect x="260" y="50" width="225" height="225" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="278" y="82" fill="#172139" font-size="19" font-weight="700"><tspan x="278" dy="0">Transformar</tspan></text><text x="278" y="134" fill="#647086" font-size="17" font-weight="400"><tspan x="278" dy="0">Nulos, duplicados,</tspan><tspan x="278" dy="22.1">reglas y rechazos</tspan></text></g><path d="M487 160L504 160" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#etl-controles-arrow)"/><g class="visual-node" style="--node-delay:280ms"><rect x="510" y="50" width="225" height="225" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="528" y="82" fill="#172139" font-size="19" font-weight="700"><tspan x="528" dy="0">Cargar</tspan></text><text x="528" y="134" fill="#647086" font-size="17" font-weight="400"><tspan x="528" dy="0">Conteo, esquema e</tspan><tspan x="528" dy="22.1">idempotencia</tspan></text></g><path d="M737 160L754 160" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#etl-controles-arrow)"/><g class="visual-node" style="--node-delay:420ms"><rect x="760" y="50" width="225" height="225" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="778" y="82" fill="#2345cc" font-size="19" font-weight="700"><tspan x="778" dy="0">Decidir</tspan></text><text x="778" y="134" fill="#647086" font-size="17" font-weight="400"><tspan x="778" dy="0">Consumidor, evidencia</tspan><tspan x="778" dy="22.1">y responsable</tspan></text></g></g></svg>