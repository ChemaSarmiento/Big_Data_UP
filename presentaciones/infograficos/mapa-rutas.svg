 Construir</tspan></text><text x="424" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="424" dy="0">ETL y calidad</tspan></text></g><path d="M586 107L599 107" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#mapa-rutas-arrow)"/><g class="visual-node" style="--node-delay:420ms"><rect x="604" y="35" width="180" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="622" y="67" fill="#172139" font-size="19" font-weight="700"><tspan x="622" dy="0">S7–8 · Evaluar</tspan></text><text x="622" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="622" dy="0">Latencia, costo y</tspan><tspan x="622" dy="22.1">riesgo</tspan></text></g><path d="M784 107L797 107" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#mapa-rutas-arrow)"/><g class="visual-node" style="--node-delay:560ms"><rect x="802" y="35" width="180" height="145" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="820" y="67" fill="#2345cc" font-size="19" font-weight="700"><tspan x="820" dy="0">S9 · Defender</tspan></text><text x="820" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="820" dy="0">Conclusión y</tspan><tspan x="820" dy="22.1">evidencia</tspan></text></g><text x="10" y="208" fill="#2345cc" font-size="13" font-weight="700"><tspan x="10" dy="0">MAESTRÍA</tspan></text><g class="visual-node" style="--node-delay:0ms"><rect x="10" y="220" width="180" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="28" y="252" fill="#172139" font-size="19" font-weight="700"><tspan x="28" dy="0">S1–2 · Diseñar</tspan></text><text x="28" y="304" fill="#647086" font-size="17" font-weight="400"><tspan x="28" dy="0">Arquitectura y</tspan><tspan x="28" dy="22.1">costo</tspan></text></g><path d="M190 292L203 292" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#mapa-rutas-arrow)"/><g class="visual-node" style="--node-delay:140ms"><rect x="208" y="220" width="180" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="22