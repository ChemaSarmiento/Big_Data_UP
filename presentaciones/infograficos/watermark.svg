<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="watermark-title watermark-desc"><title id="watermark-title">La tardanza se mide contra el tiempo del evento</title><desc id="watermark-desc">Ejemplo didáctico de watermark de dos minutos; el descarte depende del operador y del watermark aplicado a ese lote, no de dos minutos de reloj de pared.</desc><defs><marker id="watermark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><text x="10" y="25" fill="#172139" font-size="21" font-weight="700"><tspan x="10" dy="0">Máximo tiempo de evento observado: 12:05 · umbral ilustrativo: 12:03</tspan></text><line x1="100" y1="155" x2="900" y2="155" stroke="#d9dde7" stroke-width="4"/><g class="visual-node" style="--node-delay:0ms"><circle cx="150" cy="155" r="9" fill="#647086"/><text x="110" y="120" fill="#172139" font-size="23" font-weight="700"><tspan x="110" dy="0">12:01</tspan></text><text x="35" y="200" fill="#647086" font-size="18" font-weight="400"><tspan x="35" dy="0">Fuera del horizonte de</tspan><tspan x="35" dy="23.400000000000002">tolerancia</tspan></text></g><g class="visual-node" style="--node-delay:140ms"><circle cx="500" cy="155" r="9" fill="#2345cc"/><text x="460" y="120" fill="#172139" font-size="23" font-weight="700"><tspan x="460" dy="0">12:03</tspan></text><text x="385" y="200" fill="#2345cc" font-size="18" font-weight="400"><tspan x="385" dy="0">Watermark = máximo</tspan><tspan x="385" dy="23.400000000000002">observado − 2 min</tspan></text></g><g class="visual-node" style="--node-delay:280ms"><circle cx="800" cy="155" r="9" fill="#647086"/><text x="760" y="120" fill="#172139" font-size="23" font-weight="700"><tspan x="760" dy="0">12:04</tspan></text><text x="685" y="200" fill="#647086" font-size="18" font-weight="400"><tspan x="685" dy="0">Dentro de la tolerancia</tspan><tspan x="685" dy="23.400000000000002">declarada</tspan></text></g><text x="10" y="315" fill="#647086" font-size="18" font-weight="400"><tspan x="10" dy="0">Se muestra tiempo de evento, no hora de llegada. Un watermark acota estado; no elimina por sí solo</tspan><tspan x="10" dy="23.400000000000002">duplicados.</tspan></text></g></svg>