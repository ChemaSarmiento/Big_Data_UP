<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="sin-fuga-title sin-fuga-desc"><title id="sin-fuga-title">Separar primero evita aprender del futuro</title><desc id="sin-fuga-desc">Ajustar transformaciones solo sobre entrenamiento. Durante CV, el pipeline se reajusta en cada fold. Test se reserva para la evaluación final.</desc><defs><marker id="sin-fuga-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><text x="10" y="23" fill="#2345cc" font-size="13" font-weight="700"><tspan x="10" dy="0">HOLDOUT FUTURO</tspan></text><g class="visual-node" style="--node-delay:0ms"><rect x="10" y="35" width="225" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="28" y="67" fill="#172139" font-size="19" font-weight="700"><tspan x="28" dy="0">Separar por fecha</tspan></text><text x="28" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="28" dy="0">Train anterior / test</tspan><tspan x="28" dy="22.1">futuro</tspan></text></g><path d="M237 105L254 105" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#sin-fuga-arrow)"/><g class="visual-node" style="--node-delay:140ms"><rect x="260" y="35" width="225" height="145" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="278" y="67" fill="#2345cc" font-size="19" font-weight="700"><tspan x="278" dy="0">Aprender en train</tspan></text><text x="278" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="278" dy="0">Imputación,</tspan><tspan x="278" dy="22.1">categorías, escala</tspan></text></g><path d="M487 105L504 105" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#sin-fuga-arrow)"/><g class="visual-node" style="--node-delay:280ms"><rect x="510" y="35" width="225" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="528" y="67" fill="#172139" font-size="19" font-weight="700"><tspan x="528" dy="0">Evaluar en test</tspan></text><text x="528" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="528" dy="0">Transformar sin volver</tspan><tspan x="528" dy="22.1">a fit</tspan></text></g><path d="M737 105L754 105" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#sin-fuga-arrow)"/><g class="visual-node" style="--node-delay:420ms"><rect x="760" y="35" width="225" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="778" y="67" fill="#172139" font-size="19" font-weight="700"><tspan x="778" dy="0">Guardar versión</tspan></text><text x="778" y="119" fill="#647086" font-size="17" font-weight="400"><tspan x="778" dy="0">Features + modelo +</tspan><tspan x="778" dy="22.1">métricas</tspan></text></g><text x="10" y="203" fill="#2345cc" font-size="13" font-weight="700"><tspan x="10" dy="0">SELECCIÓN CON CV</tspan></text><g class="visual-node" style="--node-delay:0ms"><rect x="10" y="215" width="225" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="28" y="247" fill="#172139" font-size="19" font-weight="700"><tspan x="28" dy="0">Solo dentro de train</tspan></text><text x="28" y="299" fill="#647086" font-size="17" font-weight="400"><tspan x="28" dy="0">Reservar test para el</tspan><tspan x="28" dy="22.1">final</tspan></text></g><path d="M237 285L254 285" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#sin-fuga-arrow)"/><g class="visual-node" style="--node-delay:140ms"><rect x="260" y="215" width="225" height="145" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="278" y="247" fill="#2345cc" font-size="19" font-weight="700"><tspan x="278" dy="0">Cada fold aprende</tspan></text><text x="278" y="299" fill="#647086" font-size="17" font-weight="400"><tspan x="278" dy="0">Pipeline completo, no</tspan><tspan x="278" dy="22.1">solo LR</tspan></text></g><path d="M487 285L504 285" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#sin-fuga-arrow)"/><g class="visual-node" style="--node-delay:280ms"><rect x="510" y="215" width="225" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="528" y="247" fill="#172139" font-size="19" font-weight="700"><tspan x="528" dy="0">Elegir por</tspan><tspan x="528" dy="24.7">validación</tspan></text><text x="528" y="299" fill="#647086" font-size="17" font-weight="400"><tspan x="528" dy="0">Declarar métrica y</tspan><tspan x="528" dy="22.1">baseline</tspan></text></g><path d="M737 285L754 285" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#sin-fuga-arrow)"/><g class="visual-node" style="--node-delay:420ms"><rect x="760" y="215" width="225" height="145" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="778" y="247" fill="#172139" font-size="19" font-weight="700"><tspan x="778" dy="0">Probar tiempo</tspan></text><text x="778" y="299" fill="#647086" font-size="17" font-weight="400"><tspan x="778" dy="0">CV aleatoria no prueba</tspan><tspan x="778" dy="22.1">futuro</tspan></text></g></g></svg>