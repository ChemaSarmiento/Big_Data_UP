<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="presupuesto-title presupuesto-desc"><title id="presupuesto-title">El crédito necesita reserva y límites por práctica</title><desc id="presupuesto-desc">Distribución docente de 300 dólares: 130 Spark, 35 VM, 45 consultas y almacenamiento, 15 ingesta y 75 reserva. No son tarifas ni garantía de suficiencia.</desc><defs><marker id="presupuesto-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><text x="10" y="25" fill="#172139" font-size="21" font-weight="700"><tspan x="10" dy="0">US$300 / 90 días · asignación de planificación, no cotización</tspan></text><g class="visual-node" style="--node-delay:0ms"><text x="10" y="78" fill="#172139" font-size="18" font-weight="400"><tspan x="10" dy="0">Spark distribuido</tspan></text><rect x="260" y="55" width="520" height="30" rx="5" fill="#aeb8cd"/><text x="795" y="77" fill="#172139" font-size="18" font-weight="700"><tspan x="795" dy="0">US$130</tspan></text></g><g class="visual-node" style="--node-delay:140ms"><text x="10" y="133" fill="#172139" font-size="18" font-weight="400"><tspan x="10" dy="0">VM Airflow / API</tspan></text><rect x="260" y="110" width="140" height="30" rx="5" fill="#aeb8cd"/><text x="415" y="132" fill="#172139" font-size="18" font-weight="700"><tspan x="415" dy="0">US$35</tspan></text></g><g class="visual-node" style="--node-delay:280ms"><text x="10" y="188" fill="#172139" font-size="18" font-weight="400"><tspan x="10" dy="0">BigQuery / storage</tspan></text><rect x="260" y="165" width="180" height="30" rx="5" fill="#aeb8cd"/><text x="455" y="187" fill="#172139" font-size="18" font-weight="700"><tspan x="455" dy="0">US$45</tspan></text></g><g class="visual-node" style="--node-delay:420ms"><text x="10" y="243" fill="#172139" font-size="18" font-weight="400"><tspan x="10" dy="0">Ingesta / Pub/Sub</tspan></text><rect x="260" y="220" width="60" height="30" rx="5" fill="#aeb8cd"/><text x="335" y="242" fill="#172139" font-size="18" font-weight="700"><tspan x="335" dy="0">US$15</tspan></text></g><g class="visual-node" style="--node-delay:560ms"><text x="10" y="298" fill="#172139" font-size="18" font-weight="400"><tspan x="10" dy="0">Reserva</tspan></text><rect x="260" y="275" width="300" height="30" rx="5" fill="#2345cc"/><text x="575" y="297" fill="#172139" font-size="18" font-weight="700"><tspan x="575" dy="0">US$75</tspan></text></g><text x="10" y="360" fill="#647086" font-size="17" font-weight="400"><tspan x="10" dy="0">Revisar saldo por lab. Las alertas no apagan recursos. La reserva protege repeticiones y diferencias de tarifas.</tspan></text></g></svg>