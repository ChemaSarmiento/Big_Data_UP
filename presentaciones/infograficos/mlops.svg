<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="mlops-title mlops-desc"><title id="mlops-title">Drift no es una orden de despliegue</title><desc id="mlops-desc">Investigar, entrenar un candidato versionado, evaluarlo y decidir si reemplazar o conservar el modelo actual.</desc><defs><marker id="mlops-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><g class="visual-node" style="--node-delay:0ms"><rect x="10" y="40" width="225" height="230" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="28" y="72" fill="#172139" font-size="19" font-weight="700"><tspan x="28" dy="0">Investigar</tspan></text><text x="28" y="124" fill="#647086" font-size="17" font-weight="400"><tspan x="28" dy="0">Drift, calidad,</tspan><tspan x="28" dy="22.1">etiquetas y costo</tspan></text></g><path d="M237 155L254 155" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#mlops-arrow)"/><g class="visual-node" style="--node-delay:140ms"><rect x="260" y="40" width="225" height="230" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="278" y="72" fill="#172139" font-size="19" font-weight="700"><tspan x="278" dy="0">Entrenar candidato</tspan></text><text x="278" y="124" fill="#647086" font-size="17" font-weight="400"><tspan x="278" dy="0">Datos/fecha/versiones</tspan><tspan x="278" dy="22.1">del run</tspan></text></g><path d="M487 155L504 155" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#mlops-arrow)"/><g class="visual-node" style="--node-delay:280ms"><rect x="510" y="40" width="225" height="230" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="528" y="72" fill="#2345cc" font-size="19" font-weight="700"><tspan x="528" dy="0">Evaluar</tspan></text><text x="528" y="124" fill="#647086" font-size="17" font-weight="400"><tspan x="528" dy="0">Baseline, ROC/PR-AUC y</tspan><tspan x="528" dy="22.1">umbral</tspan></text></g><path d="M737 155L754 155" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#mlops-arrow)"/><g class="visual-node" style="--node-delay:420ms"><rect x="760" y="40" width="225" height="230" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="778" y="72" fill="#172139" font-size="19" font-weight="700"><tspan x="778" dy="0">Desplegar o</tspan><tspan x="778" dy="24.7">conservar</tspan></text><text x="778" y="124" fill="#647086" font-size="17" font-weight="400"><tspan x="778" dy="0">Cargar versión</tspan><tspan x="778" dy="22.1">aceptada; rechazar no</tspan><tspan x="778" dy="22.1">cambia API</tspan></text></g><text x="10" y="325" fill="#647086" font-size="18" font-weight="400"><tspan x="10" dy="0">Drift pide investigar. El modelo nuevo necesita evidencia antes de reemplazar al anterior.</tspan></text></g></svg>