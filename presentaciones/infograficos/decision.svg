<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="decision-title decision-desc"><title id="decision-title">La arquitectura se elige por la decisión</title><desc id="decision-desc">Tres alternativas según latencia, complejidad y evidencia, no por prestigio de la herramienta.</desc><defs><marker id="decision-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#647086"/></marker></defs><g font-family="Arial, sans-serif"><g class="visual-node" style="--node-delay:0ms"><rect x="310" y="5" width="380" height="125" rx="12" fill="#edf0fc" stroke="#2345cc"/><text x="328" y="37" fill="#2345cc" font-size="19" font-weight="700"><tspan x="328" dy="0">¿Qué decisión debe cambiar?</tspan></text><text x="328" y="89" fill="#647086" font-size="17" font-weight="400"><tspan x="328" dy="0">Define latencia, volumen y complejidad</tspan></text></g><path d="M500 135L170 150" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#decision-arrow)"/><g class="visual-node" style="--node-delay:140ms"><rect x="15" y="155" width="310" height="155" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="33" y="187" fill="#172139" font-size="19" font-weight="700"><tspan x="33" dy="0">SQL / batch</tspan></text><text x="33" y="239" fill="#647086" font-size="17" font-weight="400"><tspan x="33" dy="0">Datos consultables; el</tspan><tspan x="33" dy="22.1">resultado puede esperar</tspan></text></g><path d="M500 135L500 150" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#decision-arrow)"/><g class="visual-node" style="--node-delay:280ms"><rect x="345" y="155" width="310" height="155" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="363" y="187" fill="#172139" font-size="19" font-weight="700"><tspan x="363" dy="0">Spark distribuido</tspan></text><text x="363" y="239" fill="#647086" font-size="17" font-weight="400"><tspan x="363" dy="0">Cómputo o transformaciones</tspan><tspan x="363" dy="22.1">justifican repartir trabajo</tspan></text></g><path d="M500 135L830 150" stroke="#647086" stroke-width="2" fill="none" marker-end="url(#decision-arrow)"/><g class="visual-node" style="--node-delay:420ms"><rect x="675" y="155" width="310" height="155" rx="12" fill="#ffffff" stroke="#d9dde7"/><text x="693" y="187" fill="#172139" font-size="19" font-weight="700"><tspan x="693" dy="0">Stream / microlotes</tspan></text><text x="693" y="239" fill="#647086" font-size="17" font-weight="400"><tspan x="693" dy="0">Una llegada rápida cambia la</tspan><tspan x="693" dy="22.1">acción del usuario</tspan></text></g><text x="20" y="345" fill="#647086" font-size="18" font-weight="400"><tspan x="20" dy="0">Comparar costo, calidad y latencia antes de elegir; tamaño por sí solo no demuestra necesidad.</tspan></text></g></svg>